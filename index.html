<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailySpace — Tu Diario Digital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <span class="logo-icon">✨</span>
      <h2>DailySpace</h2>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="#feed">Para ti</a></li>
        <li><a href="#create">Nueva Entrada</a></li>
        <li id="userGreeting" class="user-greeting">Invitado</li>
        <li><button id="logoutBtn" class="btn-secondary" style="display: none;">Cerrar Sesión</button></li>
      </ul>
    </nav>
  </header>

  <div class="modal-overlay" id="loginModal">
    <div class="modal-content">
      <h2>¡Bienvenido a DailySpace! 💛</h2>
      <p>Ingresa tus datos para explorar y escribir tu bitácora diaria.</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Nombre de usuario:</label>
          <input type="text" id="username" placeholder="ej. mariaisabel">
          <span class="error-msg" id="usernameError"></span>
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" placeholder="usuario@correo.com">
          <span class="error-msg" id="emailError"></span>
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres">
          <span class="error-msg" id="passwordError"></span>
        </div>
        <button type="submit" class="btn-primary">Entrar a DailySpace</button>
      </form>
    </div>
  </div>

  <main class="container">
    <section class="hero-section">
      <h1>Descubre y comparte vivencias del día a día</h1>
      <p>Un espacio donde cada momento cuenta.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
