<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailySpace — Tu Diario Digital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <span class="logo-icon">✨</span>
      <h2>DailySpace</h2>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="#feed">Para ti</a></li>
        <li><a href="#create">Nueva Entrada</a></li>
        <li id="userGreeting" class="user-greeting">Invitado</li>
        <li><button id="logoutBtn" class="btn-secondary" style="display: none;">Cerrar Sesión</button></li>
      </ul>
    </nav>
  </header>

  <div class="modal-overlay" id="loginModal">
    <div class="modal-content">
      <h2>¡Bienvenido a DailySpace! 💛</h2>
      <p>Ingresa tus datos para explorar y escribir tu bitácora diaria.</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Nombre de usuario:</label>
          <input type="text" id="username" placeholder="ej. mariaisabel">
          <span class="error-msg" id="usernameError"></span>
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" placeholder="usuario@correo.com">
          <span class="error-msg" id="emailError"></span>
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres">
          <span class="error-msg" id="passwordError"></span>
        </div>
        <button type="submit" class="btn-primary">Entrar a DailySpace</button>
      </form>
    </div>
  </div>

  <main class="container">
    <section class="hero-section">
      <h1>Descubre y comparte vivencias del día a día</h1>
      <p>Un espacio donde cada momento cuenta.</p>
    </section>

    <section id="create" class="create-section">
     <h2>Crear nueva entrada en tu blog</h2>
     <form id="postForm" class="post-form" novalidate>
      <div class="form-group">
        <label for="postTitle">Título de tu entrada:</label>
        <input type="text" id="postTitle" placeholder="Ej. Día de simulación en Python">
        <span class="error-msg" id="postTitleError"></span>
      </div>
      <div class="form-group">
        <label for="postMedia">URL de imagen o gif:</label>
        <input type="url" id="postMedia" placeholder="https://ejemplo.com/foto.jpg">
        <span class="error-msg" id="postMediaError"></span>
      </div>
      <div class="form-group">
        <label for="postContent">¿Qué hiciste hoy?</label>
        <textarea id="postContent" rows="4" placeholder="Detalles de tu día..."></textarea>
        <span class="error-msg" id="postContentError"></span>
      </div>
      <div class="form-group">
        <label for="postVisibility">Visibilidad:</label>
        <select id="postVisibility">
          <option value="Público">🟢 Público (Todos)</option>
          <option value="Privado">🔒 Privado (Solo seguidores)</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Publicar Entrada</button>
    </form>
  </section>

  <section id="feed" class="feed-section">
    <div class="feed-header">
      <h2>Para ti</h2>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="Público">Públicos</button>
        <button class="filter-btn" data-filter="Privado">Privados</button>
      </div>
    </div>
    <div class="posts-grid" id="postsGrid"></div>
  </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
